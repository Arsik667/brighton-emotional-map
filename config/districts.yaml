# Границы районов Брайтона (приблизительные, нарисованы вручную).
#
# ВАЖНО / честная оговорка для README:
# У районов Брайтона нет официальных административных границ в открытом виде.
# Это ручная аппроксимация по улицам-ориентирам. Для портфолио-проекта это
# нормально, но об этом надо ЗНАТЬ и написать в README - на собеседовании
# спросят "а откуда границы?", и правильный ответ: "я их задал сам, вот как".
#
# Формат координат: [longitude, latitude] - как в GeoJSON (сначала долгота!).
# Частая ошибка новичков: перепутать местами lat и lon. Тест это ловит.
#
# priority: если точка попала сразу в несколько полигонов, выигрывает
# район с МЕНЬШИМ числом. Набережная самая "специфичная" - бар на пляже
# логичнее считать seafront, а не The Lanes.

crs: "EPSG:4326"  # обычные GPS-градусы (WGS84)

districts:

  seafront:
    name: "Seafront"
    name_ru: "Набережная"
    priority: 1
    color: "#1f77b4"
    # Узкая полоса вдоль берега: линия моря + ~200 м вглубь суши.
    # Берег идёт по диагонали - на востоке (Марина) южнее, на западе (Hove) севернее.
    polygon:
      - [-0.1050, 50.8110]   # Brighton Marina
      - [-0.1368, 50.8148]   # Palace Pier
      - [-0.1521, 50.8200]   # i360 / West Pier
      - [-0.1750, 50.8240]   # Hove Lawns
      - [-0.1930, 50.8272]   # Hove Lagoon
      - [-0.1930, 50.8292]   # обратно на восток, на 200 м севернее
      - [-0.1750, 50.8260]
      - [-0.1521, 50.8220]
      - [-0.1368, 50.8168]
      - [-0.1050, 50.8130]

  the_lanes:
    name: "The Lanes"
    name_ru: "The Lanes"
    priority: 2
    color: "#d62728"
    # Южнее North Street, севернее Kings Road, между West St и Old Steine.
    # Восточная граница доведена до -0.1358 (Old Steine), чтобы Royal Pavilion
    # и Pavilion Gardens не проваливались в "other". Южная - до 50.8180,
    # чтобы не было щели между The Lanes и полосой набережной.
    polygon:
      - [-0.1465, 50.8180]
      - [-0.1358, 50.8180]
      - [-0.1358, 50.8238]
      - [-0.1465, 50.8238]

  north_laine:
    name: "North Laine"
    name_ru: "North Laine"
    priority: 2
    color: "#ff7f0e"
    # Севернее North Street до вокзала, между Queens Road и Grand Parade
    polygon:
      - [-0.1440, 50.8238]
      - [-0.1358, 50.8238]
      - [-0.1358, 50.8292]
      - [-0.1440, 50.8292]

  kemptown:
    name: "Kemptown"
    name_ru: "Кемптаун"
    priority: 3
    color: "#2ca02c"
    # Восточнее Old Steine: St James's St, Edward St, до Sussex Square
    polygon:
      - [-0.1368, 50.8158]
      - [-0.1180, 50.8130]
      - [-0.1180, 50.8235]
      - [-0.1368, 50.8245]

  hove:
    name: "Hove"
    name_ru: "Хоув"
    priority: 4
    color: "#9467bd"
    # Западнее Brighton, севернее набережной.
    # Сжат на 20% (стороны x0.8) относительно центра района: исходный
    # прямоугольник захватывал слишком много жилой застройки на севере
    # и западе, где заведений мало и "настроение района" ими не описывается.
    polygon:
      - [-0.1954, 50.8266]
      - [-0.1594, 50.8254]
      - [-0.1594, 50.8402]
      - [-0.1954, 50.8402]

# Общий bounding box - им ограничиваем запрос к OpenStreetMap,
# чтобы не тянуть пол-Англии. Порядок: юг, запад, север, восток.
bbox:
  south: 50.8090
  west: -0.2010
  north: 50.8430
  east: -0.1000
